name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore DotnetTemplate.slnx
      - name: Test backend
        run: dotnet test DotnetTemplate.slnx --configuration Release --no-restore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix apps/frontend
      - name: Lint frontend
        run: npm run --prefix apps/frontend lint
      - name: Typecheck frontend
        run: npm run --prefix apps/frontend typecheck
      - name: Test frontend
        run: npm run --prefix apps/frontend test:run
      - name: Build frontend
        run: npm run --prefix apps/frontend build
